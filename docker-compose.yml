services:
  # ===== MariaDB =====
  db:
    image: mariadb:10.11
    container_name: blog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-BlogRoot2026!}
      MYSQL_DATABASE: blog
      MYSQL_USER: ${DB_USER:-bloguser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-BlogUser2026!}
    volumes:
      - blog_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-net

  # ===== Blog App =====
  blog:
    build:
      context: .
      args:
        DATABASE_URL: "mysql://${DB_USER:-bloguser}:${DB_PASSWORD:-BlogUser2026!}@db:3306/blog"
    container_name: blog-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${DB_USER:-bloguser}:${DB_PASSWORD:-BlogUser2026!}@db:3306/blog"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-random-string}
      BLOG_TITLE: ${BLOG_TITLE:-My Blog}
      BLOG_DESCRIPTION: ${BLOG_DESCRIPTION:-A personal blog}
      SEED_ON_START: "true"
    volumes:
      - blog_uploads:/app/public/uploads
    ports:
      - "${BLOG_PORT:-80}:3000"
    networks:
      - blog-net

volumes:
  blog_db_data:
    driver: local
  blog_uploads:
    driver: local

networks:
  blog-net:
    driver: bridge
